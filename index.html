<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="./styles/style.css" />

    <title>Unicorn Brew | Coming Soon</title>
</head>

<body>
    <main class="coming-soon">
        <div class="bg-blur bg-blur--left"></div>
        <div class="bg-blur bg-blur--right"></div>

        <section class="hero">
            <div class="hero__content">
                <p class="hero__eyebrow">PREMIUM COFFEE EXPERIENCE</p>

                <h1 class="hero__title">
                    Unicorn Magic Brew
                    <span class="coffee-inline">Coffee</span>
                </h1>



                <p class="hero__text">
                    A bold new coffee experience is brewing. Rich taste, modern design,
                    and a smooth premium identity crafted for true coffee lovers.
                </p>

                <div class="hero__badge">
                    <span class="dot"></span>
                    Coming Soon
                </div>
            </div>

            <div class="hero__image-wrap">
                <div class="image-glow"></div>
                <img src="./assets/coffeMain.png" alt="Iced coffee" class="hero__image" />
            </div>
        </section>
    </main>
</body>

</html>
