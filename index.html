<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unicorn Magic Brew</title>

    <link rel="icon" href="./assets/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@700&family=Playfair+Display&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="./styles/style.css" />
</head>

<body>
    <!-- SVG filter -->
    <svg width="0" height="0" style="position:absolute">
        <filter id="coffee-distort">
            <feTurbulence id="coffeeNoise" type="fractalNoise" baseFrequency="0.008 0.03" numOctaves="2" />
            <feDisplacementMap id="coffeeDisplace" in="SourceGraphic" scale="5" />
        </filter>
    </svg>

    <main class="hero">
        <div class="hero__page-bg"></div>
        <div class="hero__inner">
            <p class="hero__eyebrow">PREMIUM COFFEE EXPERIENCE</p>
            <section class="hero__stage">
                <h1 class="hero__title liquid-title" data-text="UNICORN MAGIC BREW">
                    <span class="hero__title-spark"></span>
                    <span>UNICORN MAGIC BREW</span>
                </h1>

                <div class="hero__visual">
                    <div class="hero__steam"></div>
                    <div class="hero__glow"></div>
                    <div class="hero__shadow"></div>

                    <img src="./assets/coffeMain.png" alt="coffee" class="hero__image" />
                </div>

            </section>

            <section class="hero__info">
                <p class="hero__text">
                    We’re building something amazing for you. Stay tuned!
                </p>

                <div class="hero__status">
                    <span class="hero__status-text">COMING SOON</span>
                </div>

                <div class="hero__particles"></div>
            </section>

        </div>
    </main>

    <script src="./main.js"></script>
</body>

</html>
